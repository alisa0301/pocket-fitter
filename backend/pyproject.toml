[project]
name = "pocket-fitter-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "google-genai>=3.0.0",
    "pymongo>=4.13",
]

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pytest>=8",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
